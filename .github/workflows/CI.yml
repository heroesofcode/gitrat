name: CI
on: [pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Mise install
        uses: jdx/mise-action@641a2bcbed5ce4f7aa8ffed0a3af42b65cdf1094
        with:
          cache: true
          experimental: true

      - uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01

      - name: Run build
        run: mise build

      - name: Run lint
        run: mise lint

      - name: Run tests
        run: mise test

