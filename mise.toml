[settings]
lockfile = true

[tools]
rust = { version = "1.100.0", components = "clippy,rustfmt" }
zizmor = "1.32.0"
# Packages the release binary (`mise run package`); only needed on macOS.
"cargo:releasor" = { version = "2.0.1", os = ["macos"] }

[tasks.lint]
run = "cargo clippy --all-targets --all-features"

[tasks.release]
run = "cargo build --release"

[tasks.build]
run = "cargo build"

[tasks.cli]
run = "cargo run"

[tasks.test]
run = "cargo test"

[tasks.check]
run = "cargo check"

[tasks.doc]
run = "cargo doc --no-deps"

[tasks.fmt]
run = "cargo fmt --all -- --check"

[tasks.changelog]
run = "git cliff -o CHANGELOG.md"


[tasks.zizmor]
run = "zizmor .github/workflows"

[tasks.package]
run = "releasor -f gitrat"
